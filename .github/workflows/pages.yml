# Publishes the project website (site/ + README screenshots) to GitHub Pages.
# One-time: repository Settings > Pages > Source: "GitHub Actions".
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'assets/brand/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
