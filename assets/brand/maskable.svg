        <linearGradient id="hb-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a202b"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
        <radialGradient id="hb-halo" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#F27A24" stop-opacity="0.28"/><stop offset="1" stop-color="#F27A24" stop-opacity="0"/></radialGradient>
