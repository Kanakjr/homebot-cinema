<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <title>HomeBot Cinema</title>
    <defs>
        <linearGradient id="hb-glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD25A"/><stop offset="1" stop-color="#F27A24"/></linearGradient>
        <mask id="hb-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
            <rect width="512" height="512" fill="#fff"/>
            <path d="M232 268 L232 360 L318 314 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
