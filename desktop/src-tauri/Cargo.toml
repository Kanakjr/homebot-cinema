[package]
name = "cinema-desktop-spike"
version = "0.1.0"
edition = "2021"

[features]
default = ["dev-tools"]
dev-tools = []

[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
base64 = "0.22"
libc = "0.2"
raw-window-handle = "0.6"
objc2 = "0.6"
core-graphics = "0.25"
