    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    <title>HomeBot Cinema</title>
    <style>
        /* shown while the app downloads and starts; replaced as soon as React renders */
        html, body { margin: 0; background: #000; }
        .hb-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #000; color: #fff; font: 800 24px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
        .hb-boot svg { filter: drop-shadow(0 6px 22px rgba(242, 122, 36, 0.4)); animation: hb-pulse 1.8s ease-in-out infinite; }
        .hb-boot span { font-weight: 500; color: #ffd25a; }
        @keyframes hb-pulse { 0%, 100% { opacity: 0.78; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { .hb-boot svg { animation: none; } }
    </style>
    <script>
        (function() {
            function healProfile(raw) {
                if (!raw || typeof raw !== 'string') return raw;
                try {
                    var data = JSON.parse(raw);
                    if (data && typeof data === 'object') {
                        if (!data.settings || typeof data.settings !== 'object') {
                            data.settings = {};
                        }
                        if (data.settings.interfaceScale === undefined || data.settings.interfaceScale === null || isNaN(data.settings.interfaceScale)) {
                            data.settings.interfaceScale = 1.0;
                        }
                        return JSON.stringify(data);
                    }
                } catch (e) {}
                return raw;
            }

            try {
                var existing = localStorage.getItem('profile');
                if (existing) {
                    var healed = healProfile(existing);
                    if (healed !== existing) {
                        localStorage.setItem('profile', healed);
                        console.info('[HomeBot Cinema] Auto-healed localStorage profile on boot');
                    }
                }
            } catch (_) {}

            try {
                var originalGetItem = Storage.prototype.getItem;
                Storage.prototype.getItem = function(key) {
                    var val = originalGetItem.apply(this, arguments);
                    if (key === 'profile' && val) {
                        return healProfile(val);
                    }
                    return val;
                };
            } catch (_) {}

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                        registrations[i].update();
                        if (registrations[i].waiting) {
                            registrations[i].waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                    }
                }).catch(function() {});
            }
        })();
    </script>
    <%= htmlWebpackPlugin.tags.headTags %>
</head>

<body>
    <div id="app">
        <div class="hb-boot" role="status" aria-label="Loading HomeBot Cinema">
            <svg width="104" height="104" viewBox="0 0 512 512" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD25A"/><stop offset="1" stop-color="#F27A24"/></linearGradient>
                    <mask id="hbm" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/><path d="M232 268 L232 360 L318 314 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/></mask>
                </defs>
                <path d="M256 86 L420 230 V414 H92 V230 Z" fill="url(#hbg)" stroke="url(#hbg)" stroke-width="30" stroke-linejoin="round" mask="url(#hbm)"/>
            </svg>
            <div>HomeBot <span>Cinema</span></div>
        </div>
    </div>
    <%= htmlWebpackPlugin.tags.bodyTags %>
    <script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
